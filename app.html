<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge Nav Prototype</title>
<style>
:root{color-scheme:light;
  --blue:#0667E8;--blue-600:#0557C7;--blue-50:#EFF6FF;--blue-25:#F3F8FF;--navy:#090C9B;
  --lime:#E1FF00;--ink:#1F2430;--body:#404040;--muted:#6B7280;--line:#E8EDF5;--card:#fff;
  --green:#15803D;--red:#DC2626;--orange:#E87D17;
  --r:14px;--shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow-x:hidden;font-family:"Geist",Inter,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;background:var(--blue-25);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}

/* ---------- shell ---------- */
.app{display:flex;gap:24px;padding:1px 24px 1px 1px;min-height:100vh}
.chrome{display:flex;flex:none;z-index:40;background:#fff;border-radius:16px;box-shadow:var(--shadow);position:sticky;top:1px;height:calc(100vh - 2px)}
.rail{width:68px;background:var(--blue);border-radius:16px 0 0 16px;display:flex;flex-direction:column;align-items:center;padding:16px 0;color:#fff;position:relative;z-index:30}
.logo{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;margin-bottom:16px}
.logo img{width:46px;height:46px;image-rendering:auto}
.rbtn{position:relative;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin:4px 0;transition:background .2s var(--ease),transform .15s}
.rbtn:hover{background:rgba(255,255,255,.16)}
.rbtn:active{transform:scale(.94)}
.rbtn[aria-current="true"]{background:rgba(255,255,255,.24)}
.rbtn .dot{position:absolute;top:10px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 2px var(--blue)}
.rbtn .lbl{display:none}
.rail .spacer{flex:1}
.avatar{margin-top:12px;width:40px;height:40px;border-radius:10px;border:2px solid rgba(255,255,255,.4);display:grid;place-items:center}
.avatar .lbl{display:none}.avatar span{width:32px;height:32px;border-radius:7px;background:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px}
/* rail tooltip (v1) */
.tip{position:absolute;left:54px;top:50%;transform:translate(-4px,-50%);background:#111827;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s var(--ease)}
.v1 .rbtn:hover .tip,.v1 .rbtn:focus-visible .tip{opacity:1;transform:translate(0,-50%)}

/* sidebar (v1) */
.side{width:256px;padding:16px;overflow-y:auto;overflow-x:hidden;border-radius:0 16px 16px 0}
.grp{margin-top:12px}
.grp h3{margin:0;padding:7px 0;font-size:14px;font-weight:600;color:var(--ink)}
.ni{display:flex;align-items:center;width:100%;height:32px;padding:0 8px 0 16px;border-radius:8px;color:var(--body);font-size:13.5px;text-align:left;position:relative;transition:background .15s,color .15s}
.ni:hover{background:#F5F7FB;color:var(--ink)}
.ni[aria-current="page"]{background:var(--blue-25);color:var(--blue);font-weight:600}
.ni[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--blue);animation:grow .25s var(--ease)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ni .ct{margin-left:auto;min-width:28px;height:16px;padding:0 6px;border-radius:8px;background:var(--blue-50);color:var(--blue);font-size:11px;font-weight:700;display:grid;place-items:center;transition:transform .3s var(--ease)}
.ni .ct.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.3)}}
.ni .ext{margin-left:6px;font-size:11px}
.ni .lock{margin-left:auto;font-size:11px;color:var(--muted)}
.ni[aria-disabled="true"]{color:#A0A6B1}

/* ---------- location picker ---------- */
.lp{position:relative}
.lpbtn{white-space:nowrap;display:flex;align-items:center;gap:8px;width:100%;height:44px;padding:0 13px;border:1px solid #D6DCE6;border-radius:8px;background:#fff;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.lpbtn:hover{border-color:#AFC3E6}
.lpbtn[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(6,103,232,.15)}
.lpbtn .chev{margin-left:auto;transition:transform .2s var(--ease)}
.lpbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.lpbtn.sm{height:40px;width:auto;gap:12px}
.lpstatic{display:flex;align-items:center;gap:8px;height:44px;padding:0 13px;border-radius:8px;background:#F5F7FB;font-weight:600}
.pop{position:absolute;top:calc(100% + 6px);left:0;width:320px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.16);z-index:60;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top left;pointer-events:none;transition:opacity .16s,transform .2s var(--ease)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop .srch{display:flex;align-items:center;gap:8px;margin:10px;padding:0 10px;height:38px;border:1px solid #D6DCE6;border-radius:8px}
.pop .srch input{border:0;outline:0;font:inherit;flex:1;min-width:0}
.pop .sec{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 14px 4px}
.pop ul{list-style:none;margin:0;padding:0 6px 6px;max-height:340px;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:8px;text-align:left}
.opt:hover,.opt.act{background:#F5F7FB}
.opt[aria-selected="true"]{color:var(--blue);font-weight:600}
.opt small{margin-left:auto;color:var(--muted);font-weight:400}
.opt .ck{width:16px;color:var(--blue);visibility:hidden}
.opt[aria-selected="true"] .ck{visibility:visible}
.pop .ft{border-top:1px solid var(--line);padding:9px 14px;font-size:12px;color:var(--muted)}

/* ---------- main ---------- */
main{flex:1;min-width:0;padding-top:8px}
.crumb{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center;min-height:20px}
.crumb button{color:var(--muted)}
.crumb button:hover{color:var(--blue);text-decoration:underline}
.crumb b{color:var(--ink);font-weight:500}
.head{flex-wrap:wrap;display:flex;align-items:center;gap:16px;margin:4px 0 0}
.head h1{margin:0;font-size:38px;line-height:52px;font-weight:700;color:var(--blue);letter-spacing:-.03em}
.primary{white-space:nowrap;flex:none;margin-left:auto;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:8px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;box-shadow:0 2px 6px rgba(6,103,232,.3);transition:background .15s,transform .15s,box-shadow .15s}
.primary:hover{background:var(--blue-600);box-shadow:0 6px 16px rgba(6,103,232,.35);transform:translateY(-1px)}
.primary:active{transform:translateY(0)}
.view{margin-top:24px;animation:fade .28s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card+.card{margin-top:24px}
.ch{flex-wrap:wrap;display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:20px;font-weight:500}
.ch p{margin:2px 0 0;font-size:12px;color:var(--body)}
.ch p em{font-style:normal;color:var(--blue)}
.seg{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:10px;position:relative}
.seg button{white-space:nowrap;position:relative;z-index:1;height:36px;padding:0 12px;border-radius:8px;color:var(--body);font-size:14px;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--blue);font-weight:500}
.seg .pill{position:absolute;top:3px;height:36px;border-radius:8px;background:var(--blue-50);transition:left .25s var(--ease),width .25s var(--ease)}
.kpis{display:grid;grid-template-columns:1fr 1fr}
.kpi{min-width:0;padding:16px;display:flex;gap:16px;border-bottom:1px solid var(--line);position:relative;transition:background .15s}
.kpi:nth-child(odd){border-right:1px solid var(--line)}
.kpi:nth-last-child(-n+2){border-bottom:0}
.kpi:hover{background:#FAFCFF}
.kpi .t{font-size:16px;color:var(--body)}
.kpi .v{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.kpi .v b{font-size:24px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px}
.kpi .d.up{color:var(--green)} .kpi .d.bad{color:var(--red)}
.kpi .s{font-size:11px;color:var(--body);margin-top:4px}
.kpi .lnk{font-size:12px;margin-top:6px;display:inline-block;color:var(--blue);text-decoration:underline}
.kpi .viz{margin-left:auto;width:112px;align-self:center}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:#eee}
.bar i{display:block;transition:width .6s var(--ease)}
.leg{white-space:nowrap;gap:8px;display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:var(--body)}
.leg span::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:1px;background:var(--c)}
.spark path{transition:d .5s var(--ease)}
.chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 13px;border:1px solid #D6DCE6;border-radius:8px;background:#fff;color:var(--body);font-size:14px;transition:all .15s}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.rank{overflow:hidden;transition:max-height .35s var(--ease)}
.rank table{width:100%}
.tasks .ch{border:0;padding-bottom:4px}
.tasks .ch a{font-size:12px;display:block;margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;color:var(--body);transition:background .15s}
.ibtn:hover{background:#F5F7FB}
.ttabs{display:flex;gap:26px;margin:16px 16px 0;border-bottom:1px solid var(--line);position:relative}
.ttabs button{padding:10px 0;font-size:12px;color:var(--body)}
.ttabs button[aria-selected="true"]{color:var(--blue);font-weight:600}
.ttabs .late{color:var(--red)}
.ttabs .ul{position:absolute;bottom:-1px;height:2px;background:var(--blue);transition:left .25s var(--ease),width .25s var(--ease)}
.tl{list-style:none;margin:0 16px 16px;padding:0}
.tl li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);animation:fade .25s var(--ease)}
.tl input{width:17px;height:17px;margin:12px 0 0;accent-color:var(--blue);flex:none}
.tl .tt{font-size:14px;transition:color .2s}
.tl .tm{display:flex;justify-content:space-between;font-size:12px;color:var(--body);margin-top:6px}
.tl .tm .late{color:var(--red)}
.tl li.done .tt{color:var(--muted);text-decoration:line-through}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#FAFBFD}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl tr{transition:background .12s}
.tbl tbody tr:hover{background:#FAFCFF}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--blue-50);color:var(--blue);font-size:12px;font-weight:500}
.st{display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,#9CA3AF)}
.toolbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.toolbar input{height:36px;border:1px solid #D6DCE6;border-radius:8px;padding:0 10px;font:inherit;width:240px}
.toolbar .meta{margin-left:auto;color:var(--muted);font-size:12px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;background:#F5F7FB;border:1px solid var(--line);font-size:13px;margin-bottom:16px}
.picker{padding:28px;text-align:center}
.picker h3{margin:0 0 6px;font-size:18px}
.picker p{margin:0 0 18px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;text-align:left}
.fcard{border:1px solid var(--line);border-radius:10px;padding:12px;transition:all .15s;background:#fff}
.fcard:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(6,103,232,.12);transform:translateY(-1px)}
.fcard b{display:block}.fcard small{color:var(--muted)}
.map{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;padding:16px}
.map i{aspect-ratio:1.4;border-radius:3px;background:#DCE8FB;transition:transform .15s}
.map i.o{background:var(--blue)} .map i.m{background:var(--orange)}
.map i:hover{transform:scale(1.25)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.modal{width:440px;max-width:92vw;background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.25);transform:translateY(10px) scale(.98);transition:transform .25s var(--ease)}
.scrim.open .modal{transform:none}
.modal header{padding:20px 20px 8px}
.modal h2{margin:0;font-size:20px}
.modal p{margin:4px 0 0;color:var(--muted);font-size:13px}
.modal .bd{padding:8px 20px;max-height:340px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px}
.ghost{height:40px;padding:0 14px;border-radius:8px;border:1px solid #D6DCE6;background:#fff}
.modal .primary{height:40px;font-size:14px;margin:0}
.modal .primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.radio{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.radio:hover{border-color:#AFC3E6}
.radio:has(input:checked){border-color:var(--blue);background:var(--blue-25)}
.radio input{accent-color:var(--blue)}
.radio small{margin-left:auto;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:all .3s var(--ease);z-index:120;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* prototype control panel */
.proto{position:fixed;right:16px;bottom:16px;z-index:90;font-size:12.5px}
.proto>button{height:36px;padding:0 12px;border-radius:18px;background:#111827;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px}
.proto .pp{position:absolute;right:0;bottom:44px;width:270px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.18);padding:14px;opacity:0;transform:translateY(6px);pointer-events:none;transition:all .2s var(--ease)}
.proto.open .pp{opacity:1;transform:none;pointer-events:auto}
.proto label{display:flex;gap:8px;align-items:flex-start;padding:7px;border-radius:8px;cursor:pointer}
.proto label:hover{background:#F5F7FB}
.proto label small{display:block;color:var(--muted)}
.proto h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.proto .sw{display:flex;gap:6px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.proto .sw a{flex:1;text-align:center;padding:7px;border-radius:8px;border:1px solid var(--line);text-decoration:none}
.proto .sw a.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ================= V2 ================= */
.v2 .chrome{background:transparent;box-shadow:none;width:68px}
.v2 .rail{border-radius:16px;position:absolute;left:0;top:0;bottom:0;width:68px;align-items:stretch;padding:16px 14px;overflow:hidden;transition:width .28s var(--ease),box-shadow .28s}
.v2 .rail.exp{width:248px;box-shadow:12px 0 40px rgba(6,40,120,.28)}
.v2 .logo{margin-left:-4px}
.v2 .rbtn{width:100%;justify-content:flex-start;padding:0 10px;gap:14px;margin:4px 0}
.v2 .rbtn .lbl{display:block;white-space:nowrap;font-size:14px;font-weight:500;opacity:0;transform:translateX(-6px);transition:opacity .18s,transform .22s var(--ease)}
.v2 .rail.exp .rbtn .lbl{opacity:1;transform:none;transition-delay:.06s}
.v2 .rbtn .dot{left:26px;right:auto}
.v2 .avatar{margin-left:-6px;display:flex;align-items:center;gap:12px;width:auto;border:0;padding:0}
.v2 .avatar span{border:2px solid rgba(255,255,255,.4);width:40px;height:40px;flex:none}
.v2 .avatar .lbl{display:block;opacity:0;white-space:nowrap;font-size:13px;transition:opacity .18s;line-height:1.25}
.v2 .avatar .lbl small{opacity:.75}
.v2 .rail.exp .avatar .lbl{opacity:1}
.v2 .rail .pin{position:absolute;top:22px;right:14px;opacity:0;transition:opacity .2s;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.v2 .rail.exp .pin{opacity:1}
.v2 .rail .pin:hover{background:rgba(255,255,255,.16)}
.v2 .rail .sect{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:0;padding:12px 10px 2px;white-space:nowrap;transition:opacity .2s;height:0;overflow:hidden}
.v2 .rail.exp .sect{opacity:.7;height:auto}
.v2 .app.pinned .chrome{width:248px}
.v2 .app{transition:none}
.v2 .chrome{transition:width .28s var(--ease)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px;border-bottom:1px solid #DCE3EE;position:relative}
.tab{white-space:nowrap;position:relative;display:flex;align-items:center;gap:6px;height:44px;padding:0 16px;font-size:14px;color:var(--body);border-radius:8px 8px 0 0;transition:color .15s,background .15s}
.tab:hover{color:var(--ink);background:rgba(6,103,232,.05)}
.tab[aria-current="true"]{color:var(--blue);font-weight:600}
.tab .chev{transition:transform .2s var(--ease)}
.tab[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tabs .ul{position:absolute;bottom:-1px;height:2px;background:var(--blue);border-radius:2px;transition:left .3s var(--ease),width .3s var(--ease)}
.tabwrap{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(16,24,40,.16);padding:6px;z-index:50;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .15s,transform .2s var(--ease)}
.menu.open{opacity:1;transform:none;pointer-events:auto}
.menu .ni{padding-left:12px}
.subhead{display:flex;align-items:center;gap:8px;margin-top:20px}
.subhead h2{margin:0;font-size:22px;font-weight:600}

@media (max-width:1100px){.cols{grid-template-columns:1fr}}@media (max-width:900px){.v1 .kpis{grid-template-columns:1fr}.v1 .kpi{border-right:0!important}}
@media (max-width:560px){.side{display:none}}@media (max-width:760px){.kpis{grid-template-columns:1fr}.kpi{border-right:0!important}.head h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
/* ===== Grid & layout — Storable Web Toolkit › Grids, Guides & Responsive Layout ===== */
:root{--grid-cols:12;--grid-gap:0.75rem;--container-max:79.5rem;--container-pad:24px}
@media (max-width:767px){:root{--grid-cols:4;--container-pad:16px}}
.app{padding-right:var(--container-pad)}
.mainwrap{flex:1;min-width:0;position:relative}
main{max-width:var(--container-max);margin:0 auto;padding-top:8px}
.cols{grid-template-columns:repeat(var(--grid-cols),minmax(0,1fr));gap:var(--grid-gap)}
.cols>:first-child{grid-column:span 9}.cols>:last-child{grid-column:span 3}
.card+.card{margin-top:var(--grid-gap)}
@media (max-width:1100px){.cols>:first-child,.cols>:last-child{grid-column:1/-1}}

/* v2 hover-expand overlay */
let hoverT;
function collapse(){if(!S.pinned)$('#rail').classList.remove('exp')}
function setupHover(){
  if(LAYOUT!=='v2')return;const rail=$('#rail');
  rail.addEventListener('mouseenter',()=>{clearTimeout(hoverT);hoverT=setTimeout(()=>rail.classList.add('exp'),120)});
  rail.addEventListener('mouseleave',()=>{clearTimeout(hoverT);hoverT=setTimeout(collapse,180)});
  rail.addEventListener('focusin',()=>rail.classList.add('exp'));
  rail.addEventListener('focusout',e=>{if(!rail.contains(e.relatedTarget))collapse()});
  rail.addEventListener('keydown',e=>{if(e.key==='Escape'){collapse();document.activeElement.blur()}});
}

let lpSeq=0;
function picker(cls=''){
  const a=allowed();
  if(a.length===1)return `<div class="lpstatic" title="You have access to one facility">${ic('place',16)}${esc(a[0].n)}</div>`;
  const id='lp'+(lpSeq++);
  return `<div class="lp"><button class="lpbtn ${cls}" aria-haspopup="listbox" aria-expanded="false" aria-controls="${id}" data-lp="${id}" aria-label="Facility scope: ${esc(scopeLabel())}. Change facility"><span>${esc(scopeLabel(cls===''))}</span><span class="chev">${ic('chev',16)}</span></button>
   <div class="pop" id="${id}"><div class="srch">${ic('search',16)}<input type="text" placeholder="Search name or city" aria-label="Search facilities"></div><ul role="listbox" aria-label="Facilities"></ul><div class="ft">Showing ${a.length} facilit${a.length>1?'ies':'y'} you have access to</div></div></div>`;
}
function fillPop(pop,q=''){
  const a=allowed(),ql=q.toLowerCase();
  const opt=(id,label,meta)=>`<li><button class="opt" role="option" data-scope="${id}" aria-selected="${S.scope===id}"><span class="ck">${ic('check',16)}</span>${esc(label)}<small>${esc(meta)}</small></button></li>`;
  let h='';
  if(!q)h+=opt('all','All facilities',a.length);
  const gs=GROUPS.filter(g=>g.ids.some(i=>role().fac.includes(i))&&g.ids.filter(i=>role().fac.includes(i)).length>1&&g.ids.filter(i=>role().fac.includes(i)).length<a.length);
  if(gs.length&&!q)h+=`<li class="sec">Groups</li>`+gs.map(g=>opt(g.id,g.n,g.ids.filter(i=>role().fac.includes(i)).length)).join('');
  const fs=a.filter(f=>!q||f.n.toLowerCase().includes(ql)||f.city.toLowerCase().includes(ql)).sort((x,y)=>x.n.localeCompare(y.n));
  h+=`<li class="sec">${q?'Results':'Facilities'}</li>`+(fs.length?fs.map(f=>opt(f.id,f.n,f.city)).join(''):`<li class="empty">No facilities match “${esc(q)}”</li>`);
  pop.querySelector('ul').innerHTML=h;

    const low=/\b(least|lowest|fewest|worst collection|min)\b/.test(q)&&mk!=='pd';const rk=[...fs].sort((a,b)=>low?m.f(a)-m.f(b):m.f(b)-m.f(a));

    const page={pd:'delinquency',occ:'units',vac:'units',ld:'leads',ol:'delinquency',mr:'units',cr:'payments'}[mk];
    if(!hidden(page))R.actions.push({icon:'chart',label:`Open ${findItem(page).it.n}`,sub:fs.length>1?'Ranked across facilities':top.n,run:()=>{if(fs.length===1)setScope(top.id);go(findItem(page).rail,page)}});

    if(!R.answer)R.answer={text:fid?`I can start a move-in at ${FAC.find(f=>f.id===fid).n}. Confirm to open the form — nothing is saved until you finish it.`:'Move-ins happen at one facility. Confirm and I’ll ask which one.',scope:fid?FAC.find(f=>f.id===fid).n:scopeLabel()}}

    const where=target?scopeName(target.id):scopeLabel();

  }

const SUGG=['Which facility has the most past due?','Show leads at Eastside','Start a move-in at Northgate','Switch to North region','Which facility has the most vacant units?','Remind me to call James tomorrow'];
function aiPanel(){let p=$('#aipanel');if(!p){p=document.createElement('div');p.id='aipanel';p.className='aipanel';p.setAttribute('role','listbox');p.setAttribute('aria-label','Edge AI results');document.body.appendChild(p);p.onclick=e=>e.stopPropagation()}return p}
function aiPlace(){const f=$('#ai');if(!f)return;const r=f.getBoundingClientRect(),p=aiPanel(),w=Math.min(560,innerWidth-16);let left=r.left+r.width/2-w/2;left=Math.max(8,Math.min(left,innerWidth-8-w));Object.assign(p.style,{left:left+'px',width:w+'px',bottom:(innerHeight-r.top+10)+'px',maxHeight:(r.top-24)+'px'})}
function aiClose(){AI.open=false;const p=$('#aipanel');if(p)p.classList.remove('open');const i=$('#aiq');if(i)i.setAttribute('aria-expanded','false');$('#ai')&&$('#ai').classList.remove('on')}
function aiShow(q){AI.open=true;const p=aiPanel();aiPlace();p.classList.add('open');$('#aiq').setAttribute('aria-expanded','true');$('#ai').classList.add('on');
  clearTimeout(AI.timer);
  if(!q.trim()){AI.items=SUGG.map(s=>({icon:'spark',label:s,sub:'Try this',fill:s}));AI.sel=0;p.innerHTML=`<div class="aihead"><span class="ai-spark">✦</span><b>Edge AI</b><span class="aiscope">Scope: ${esc(scopeLabel())}</span></div><div class="aisec">Try asking</div>${AI.items.map((a,i)=>aiRow(a,i)).join('')}<div class="aifoot">Search pages, facilities and tenants, ask about your data, or tell Edge what to do. Actions that change data always ask you to confirm first.</div>`;bindRows();return}
  p.innerHTML=`<div class="aihead"><span class="ai-spark spin">✦</span><b>Edge AI</b><span class="aiscope">Thinking…</span></div><div class="aishimmer"><i></i><i></i><i></i></div>`;
  AI.timer=setTimeout(()=>{const R=aiParse(q);AI.items=R.actions;AI.sel=AI.items.findIndex(a=>!a.disabled);if(AI.sel<0)AI.sel=0;
    p.innerHTML=`<div class="aihead"><span class="ai-spark">✦</span><b>Edge AI</b><span class="aiscope">${esc(R.answer?R.answer.scope:scopeLabel())}</span></div>
      ${R.answer?`<div class="aians ${R.answer.miss?'miss':''}"><p id="aitext" aria-live="polite"></p>${R.answer.rows?`<table class="airank">${R.answer.rows.map(([n,v,w])=>`<tr><td>${esc(n)}</td><td><i style="width:${Math.max(4,w*100)}%"></i></td><td>${esc(v)}</td></tr>`).join('')}</table>`:''}</div>`:''}
      ${AI.items.length?`<div class="aisec">${R.answer?'Next steps':'Results'}</div>${AI.items.map((a,i)=>aiRow(a,i)).join('')}`:''}

function aiRow(a,i){return `<button class="airow ${i===AI.sel?'sel':''} ${a.write?'write':''}" role="option" aria-selected="${i===AI.sel}" data-ai="${i}" ${a.disabled?'aria-disabled="true"':''}><span class="aiic">${a.icon==='spark'?'✦':a.icon==='chevR'?'→':ic(a.icon,16)}</span><span class="aitx"><b>${esc(a.label)}</b><small>${esc(a.sub||'')}</small></span>${a.write?'<span class="aiconf">Confirm</span>':a.fill?'':'<span class="aienter">↵</span>'}</button>`}
function bindRows(){aiPanel().querySelectorAll('[data-ai]').forEach(b=>{b.onmouseenter=()=>{AI.sel=+b.dataset.ai;mark()};b.onclick=()=>aiRun(+b.dataset.ai)})}

function typeOut(el,txt){if(!el)return;let i=0;el.textContent='';const step=()=>{i+=Math.max(1,Math.round(txt.length/60));el.textContent=txt.slice(0,i);if(i<txt.length)requestAnimationFrame(step)};if(matchMedia('(prefers-reduced-motion: reduce)').matches)el.textContent=txt;else step()}
